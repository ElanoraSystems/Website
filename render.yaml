services:
  - type: web
    runtime: static
    name: elanora-website
    staticPublishPath: .
    domains:
      - elanorasystems.com
      - www.elanorasystems.com

  - type: web
    runtime: node
    name: elanora-contact-api
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://elanorasystems.com,https://www.elanorasystems.com
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false
